project_name: "sure"

languages:
  - ruby
  - typescript

encoding: "utf-8"
line_ending: "lf"
language_backend: LSP
ignore_all_files_in_gitignore: true

ls_specific_settings: {}
additional_workspace_folders: []

ignored_paths:
  - "tmp/**"
  - "log/**"
  - "storage/**"
  - "coverage/**"
  - "node_modules/**"
  - "app/assets/builds/**"

read_only: false
excluded_tools: []
included_optional_tools: []
fixed_tools: []

default_modes:
  - interactive
  - editing
added_modes: []

initial_prompt: |
  Read AGENTS.md before working; it is the canonical instruction file for every agent.
  Prefer Serena symbol discovery and reference tools before broad text searches.
  Preserve unrelated worktree changes. Follow DESIGN.md for all user-facing UI work.

symbol_info_budget: 10.0
read_only_memory_patterns: []
ignored_memory_patterns: []

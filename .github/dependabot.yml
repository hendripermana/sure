# Dependabot configuration for Sure
# Diperbaiki agar kompatibel dengan aturan resmi GitHub & mendukung pnpm

version: 2
updates:
  # 1. Mengurus Pustaka Ruby (Gemfile)
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      rails:
        patterns:
          - "rails*"
          - "actionpack*"
          - "actionview*"
          - "activerecord*"
          - "activesupport*"
          - "actionmailer*"
          - "activejob*"
          - "actioncable*"
          - "activestorage*"
        update-types:
          - "minor" # <--- Sudah diperbaiki sesuai kemauan robot
          - "patch" # <--- Sudah diperbaiki sesuai kemauan robot
      testing:
        patterns:
          - "rspec*"
          - "minitest*"
          - "factory_bot*"
          - "capybara*"
          - "selenium*"
          - "webdrivers*"
      security:
        patterns:
          - "devise*"
          - "omniauth*"
          - "rack*"
          - "puma*"
          - "bcrypt*"

  # 2. Mengurus Pustaka JavaScript (Di-enhance murni ke pnpm)
  - package-ecosystem: "npm" # <--- Diubah dari npm ke pnpm agar sinkron dengan ekosistem baru
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      build-tools:
        patterns:
          - "@babel/*"
          - "webpack*"
          - "esbuild*"
          - "vite*"
        update-types:
          - "minor" # <--- Sudah diperbaiki
          - "patch" # <--- Sudah diperbaiki
      ui-framework:
        patterns:
          - "tailwindcss*"
          - "@tailwindcss/*"
          - "stimulus*"
          - "turbo*"
          - "@hotwired/*"
        update-types:
          - "minor" # <--- Sudah diperbaiki
          - "patch" # <--- Sudah diperbaiki
      testing:
        patterns:
          - "jest*"
          - "@testing-library/*"
          - "cypress*"
          - "playwright*"

  # 3. Mengurus Pembaruan Otomatis Robot GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"

  # 4. Mengurus Pembaruan Otomatis Image Docker Base
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "docker"
      include: "scope"
